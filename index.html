<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>@script2443 Raw Generator</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #0b0b0f;
    color: white;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.container {
    width: 100%;
    max-width: 700px;
    background: #15151c;
    border: 1px solid #292936;
    border-radius: 18px;
    padding: 25px;
    box-shadow: 0 10px 40px rgba(0,0,0,.45);
}

h1 {
    text-align: center;
    margin-top: 0;
    color: #ff277f;
}

.subtitle {
    text-align: center;
    color: #999;
    margin-bottom: 25px;
}

label {
    display: block;
    margin: 15px 0 7px;
    font-weight: bold;
}

input,
textarea {
    width: 100%;
    border: 1px solid #30303d;
    background: #0d0d12;
    color: white;
    border-radius: 10px;
    padding: 13px;
    outline: none;
    font-size: 15px;
}

input:focus,
textarea:focus {
    border-color: #ff277f;
}

textarea {
    min-height: 280px;
    resize: vertical;
    font-family: Consolas, monospace;
}

button {
    width: 100%;
    border: 0;
    border-radius: 10px;
    padding: 14px;
    margin-top: 18px;
    background: #ff277f;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    opacity: .9;
}

button:disabled {
    opacity: .5;
    cursor: not-allowed;
}

.result {
    display: none;
    margin-top: 25px;
    background: #0d0d12;
    border: 1px solid #30303d;
    border-radius: 12px;
    padding: 15px;
}

.result-title {
    color: #aaa;
    margin-bottom: 7px;
}

.copy-box {
    display: flex;
    gap: 8px;
}

.copy-box input {
    flex: 1;
}

.copy-box button {
    width: auto;
    margin: 0;
    padding: 10px 15px;
}

.status {
    text-align: center;
    margin-top: 15px;
    color: #aaa;
}

.error {
    color: #ff4d6d;
}

.success {
    color: #45e08a;
}
</style>
</head>

<body>

<div class="container">

    <h1>@script2443</h1>

    <div class="subtitle">
        Tạo URL Raw cho code của bạn
    </div>

    <label for="name">Tên script</label>

    <input
        id="name"
        type="text"
        maxlength="80"
        placeholder="Ví dụ: MyScript"
    >

    <label for="code">Code</label>

    <textarea
        id="code"
        placeholder="Dán hoặc viết code của bạn ở đây..."
    ></textarea>

    <button id="createButton">
        TẠO URL
    </button>

    <div id="status" class="status"></div>

    <div id="result" class="result">

        <div class="result-title">
            URL Raw
        </div>

        <div class="copy-box">
            <input id="rawUrl" readonly>
            <button onclick="copyRaw()">
                Copy
            </button>
        </div>

        <div class="result-title" style="margin-top:18px;">
            Loadstring
        </div>

        <div class="copy-box">
            <input id="loadstring" readonly>
            <button onclick="copyLoadstring()">
                Copy
            </button>
        </div>

    </div>

</div>

<script>
const API_URL = "https://YOUR-BACKEND-URL.com";

const createButton = document.getElementById("createButton");
const nameInput = document.getElementById("name");
const codeInput = document.getElementById("code");

const result = document.getElementById("result");
const rawUrl = document.getElementById("rawUrl");
const loadstring = document.getElementById("loadstring");
const status = document.getElementById("status");

createButton.addEventListener("click", async () => {

    const name = nameInput.value.trim();
    const code = codeInput.value;

    status.className = "status";
    status.textContent = "";
    result.style.display = "none";

    if (!name) {
        status.className = "status error";
        status.textContent = "Vui lòng nhập tên script.";
        return;
    }

    if (!code.trim()) {
        status.className = "status error";
        status.textContent = "Vui lòng nhập code.";
        return;
    }

    createButton.disabled = true;
    createButton.textContent = "ĐANG TẠO...";

    try {

        const response = await fetch(API_URL + "/api/create", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                name: name,
                code: code
            })
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.error || "Không thể tạo URL.");
        }

        rawUrl.value = data.rawUrl;
        loadstring.value =
            'loadstring(game:HttpGet("' +
            data.rawUrl +
            '"))()';

        result.style.display = "block";

        status.className = "status success";
        status.textContent = "Tạo URL thành công!";

    } catch (error) {

        status.className = "status error";
        status.textContent = error.message;

    } finally {

        createButton.disabled = false;
        createButton.textContent = "TẠO URL";

    }
});

async function copyRaw() {

    try {
        await navigator.clipboard.writeText(rawUrl.value);
        status.className = "status success";
        status.textContent = "Đã copy URL Raw!";
    } catch {
        rawUrl.select();
        document.execCommand("copy");
    }
}

async function copyLoadstring() {

    try {
        await navigator.clipboard.writeText(loadstring.value);
        status.className = "status success";
        status.textContent = "Đã copy Loadstring!";
    } catch {
        loadstring.select();
        document.execCommand("copy");
    }
}
</script>

</body>
</html>
