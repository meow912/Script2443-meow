<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Script2443 - Code Editor</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
  body {
    background: #0d0f16;
    color: #e6e8ec;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 30px 20px;
  }
  .container {
    width: 100%;
    max-width: 900px;
    background: #151822;
    border: 2px solid #00e676;
    border-radius: 14px;
    padding: 25px;
    box-shadow: 0 0 30px rgba(0, 230, 118, 0.15);
  }
  h1 {
    color: #00e676;
    font-size: 22px;
    margin-bottom: 8px;
    text-align: center;
  }
  .subtitle {
    text-align: center;
    color: #8b93a7;
    font-size: 13px;
    margin-bottom: 20px;
  }
  label {
    display: block;
    color: #00e676;
    font-size: 13px;
    margin-bottom: 6px;
    font-weight: 600;
  }
  input, textarea {
    width: 100%;
    background: #0d0f16;
    border: 1.5px solid #2a3142;
    border-radius: 8px;
    color: #e6e8ec;
    padding: 12px;
    font-size: 14px;
    outline: none;
    transition: 0.2s;
  }
  input:focus, textarea:focus {
    border-color: #00e676;
  }
  textarea {
    min-height: 220px;
    resize: vertical;
    font-family: 'Consolas', 'Courier New', monospace;
    line-height: 1.5;
  }
  .field { margin-bottom: 18px; }
  button {
    width: 100%;
    background: linear-gradient(90deg, #00e676, #00b0ff);
    border: none;
    border-radius: 8px;
    color: #0d0f16;
    font-size: 15px;
    font-weight: 700;
    padding: 14px;
    cursor: pointer;
    transition: 0.2s;
    margin-top: 5px;
  }
  button:hover {
    filter: brightness(1.1);
    transform: translateY(-2px);
  }
  button:active { transform: translateY(0); }

  .output {
    display: none;
    margin-top: 22px;
    padding: 18px;
    background: #0d0f16;
    border: 1.5px dashed #00e676;
    border-radius: 10px;
  }
  .output.show { display: block; }
  .output-title {
    color: #00e676;
    font-size: 13px;
    font-weight: 700;
    margin-bottom: 10px;
  }
  .url-box {
    background: #151822;
    border-radius: 6px;
    padding: 10px 12px;
    font-family: 'Consolas', monospace;
    font-size: 12px;
    color: #00b0ff;
    word-break: break-all;
    margin-bottom: 10px;
    border-left: 3px solid #00e676;
  }
  .protected {
    color: #ff5f7e;
    font-size: 13px;
    font-weight: 600;
    padding: 12px;
    background: rgba(255, 95, 126, 0.08);
    border-radius: 6px;
    border-left: 3px solid #ff5f7e;
    margin-bottom: 12px;
    line-height: 1.5;
  }
  .loadstring-box {
    background: #151822;
    border-radius: 6px;
    padding: 12px;
    font-family: 'Consolas', monospace;
    font-size: 12px;
    color: #ffd54f;
    word-break: break-all;
    border-left: 3px solid #ffd54f;
    cursor: pointer;
    transition: 0.2s;
  }
  .loadstring-box:hover {
    background: #1c2030;
  }
  .copy-hint {
    font-size: 11px;
    color: #8b93a7;
    margin-top: 6px;
    text-align: right;
  }
  .toast {
    position: fixed;
    bottom: 25px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: #00e676;
    color: #0d0f16;
    padding: 12px 22px;
    border-radius: 8px;
    font-weight: 700;
    font-size: 14px;
    transition: 0.3s;
    opacity: 0;
    pointer-events: none;
  }
  .toast.show {
    transform: translateX(-50%) translateY(0);
    opacity: 1;
  }
</style>
</head>
<body>

<div class="container">
  <h1>📝 Script2443 Code Editor</h1>
  <div class="subtitle">Viết code, đặt tên, tạo URL bảo vệ</div>

  <div class="field">
    <label>Tên script</label>
    <input type="text" id="scriptName" placeholder="VD: MyScript_v1">
  </div>

  <div class="field">
    <label>Nội dung code</label>
    <textarea id="scriptCode" placeholder="-- Viết code Lua ở đây...&#10;print('Hello World')"></textarea>
  </div>

  <button onclick="createURL()">🔗 Tạo URL</button>

  <div class="output" id="output">
    <div class="output-title">✓ URL đã tạo thành công</div>
    <div class="url-box" id="rawUrl">...</div>

    <div class="protected">
      🔒 Link đã bảo vệ người tạo web @script2443 tên giả Meow
    </div>

    <div class="output-title" style="margin-top:14px;">Loadstring để copy</div>
    <div class="loadstring-box" id="loadstringBox" onclick="copyLoadstring()">...</div>
    <div class="copy-hint">👆 Nhấn vào để copy</div>
  </div>
</div>

<div class="toast" id="toast">Đã copy!</div>

<script>
  // Mã hóa base64 (đơn giản, client-side)
  function encode(str) {
    try {
      return btoa(unescape(encodeURIComponent(str)));
    } catch(e) {
      return btoa(str);
    }
  }

  function createURL() {
    const name = document.getElementById('scriptName').value.trim();
    const code = document.getElementById('scriptCode').value;

    if (!name) {
      alert('Vui lòng nhập tên script!');
      return;
    }
    if (!code.trim()) {
      alert('Vui lòng nhập nội dung code!');
      return;
    }

    // Tạo payload = tên + code, mã hóa base64
    const payload = encode(name + '|||' + code);

    // Giả lập URL raw — trong web thật sẽ là server endpoint
    // Ở đây dùng query string để demo
    const baseUrl = window.location.origin + window.location.pathname;
    const rawUrl = baseUrl + '?s=' + payload;

    // Hiện output
    document.getElementById('rawUrl').textContent = rawUrl;

    const loadstring = 'loadstring(game:HttpGet("' + rawUrl + '"))()';
    document.getElementById('loadstringBox').textContent = loadstring;

    document.getElementById('output').classList.add('show');
  }

  function copyLoadstring() {
    const text = document.getElementById('loadstringBox').textContent;
    navigator.clipboard.writeText(text).then(() => {
      showToast('Đã copy loadstring!');
    }).catch(() => {
      // Fallback
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      showToast('Đã copy loadstring!');
    });
  }

  function showToast(msg) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 1800);
  }

  // Nếu URL có tham số ?s= → hiện thông báo bảo vệ (khi ai đó truy cập link raw)
  window.addEventListener('DOMContentLoaded', () => {
    const params = new URLSearchParams(window.location.search);
    if (params.get('s')) {
      document.body.innerHTML = `
        <div style="display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;">
          <div style="text-align:center;max-width:500px;">
            <div style="font-size:60px;margin-bottom:20px;">🔒</div>
            <h2 style="color:#ff5f7e;font-size:20px;margin-bottom:12px;">Link đã bảo vệ người tạo web @script2443 tên giả Meow</h2>
          </div>
        </div>
      `;
    }
  });
</script>

</body>
</html>
